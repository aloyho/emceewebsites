const $ = id => document.getElementById(id);
const safeUrl = u => /^(https:\/\/|\.{0,2}\/|[\w-]+\/|[\w-]+\.\w+$)/.test(u || "") ? u : "";
function h(tag, attrs, ...kids) {                          // text goes in as text nodes, never as HTML
  const e = document.createElement(tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  kids.forEach(c => e.append(c));
  return e;
}
function placeholder(label, w, hgt) {
  const s = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}"><rect width="100%" height="100%" fill="#C9D2E0"/><text x="50%" y="50%" fill="#0B1F3A" font-family="sans-serif" font-size="${w / 18}" text-anchor="middle" dominant-baseline="middle">${label}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
}
function pic(src, label, w, hgt, alt) {                    // falls back to a placeholder if the image fails to load
  const img = h("img", { src: safeUrl(src) || placeholder(label, w, hgt), alt: alt || "", loading: "lazy" });
  img.onerror = () => { img.onerror = null; img.src = placeholder(label, w, hgt); };
  return img;
}
const C = CONFIG;
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
let lang = C.languages.includes(lsGet("lang")) ? lsGet("lang") : C.languages[0];

function applyTheme() {
  document.documentElement.style.setProperty("--brand", C.brand.color);
  document.documentElement.style.setProperty("--ink", C.brand.ink);
  document.title = C.seo.title;
  const set = (sel, attr, val) => { const m = document.querySelector(sel); if (m && val) m.setAttribute(attr, val); };
  set('meta[name="description"]', "content", C.seo.description);
  set('link[rel="canonical"]', "href", C.seo.canonical);
  set('meta[property="og:title"]', "content", C.seo.title);
  set('meta[property="og:description"]', "content", C.seo.description);
  set('meta[property="og:url"]', "content", C.seo.canonical);
  set('meta[property="og:image"]', "content", C.seo.image);
}

function waLink(text) {
  const num = String(C.whatsapp.number).replace(/\D/g, "");
  return "https://wa.me/" + num + "?text=" + encodeURIComponent(text);
}

function render() {

  $("hImg").replaceWith(Object.assign(pic(C.heroImage, "Replace: hero portrait", 800, 1000, t.name), { id: "hImg", loading: "eager" }));
  $("menuBtn").setAttribute("aria-label", t.menu);
  $("strip").replaceChildren(...t.strip.map(s => h("span", {}, h("b", {}, s[0]), s[1])));

  const hasClients = C.clients.length > 0, showT = t.testimonials.length > 0, hasFaq = t.faq.length > 0;
  $("clients").hidden = !hasClients; $("testimonials").hidden = !showT; $("faq").hidden = !hasFaq;
  $("gallery").hidden = !C.gallery.length; $("process").hidden = !t.steps.length;
  const items = ["services", "portfolio", "showreel", "about"].concat(showT ? ["testimonials"] : [], hasFaq ? ["faq"] : []);
  const ul = $("navList"); ul.replaceChildren();
  items.forEach(k => ul.append(h("li", {}, h("a", { href: "#" + k }, t.nav[k]))));
  ul.append(h("li", {}, h("a", { href: "#contact", class: "nb" }, t.nav.contact)));
  if (C.languages.length > 1) {
    const other = C.languages.find(l => l !== lang);
    const b = h("button", { class: "lang", type: "button", "aria-label": "Switch language" }, other === "zh" ? "中文" : "EN");
    b.onclick = () => { lang = other; lsSet("lang", lang); render(); };
    ul.append(h("li", {}, b));
  }

  $("sT").textContent = t.servicesTitle; $("sLead").textContent = t.servicesLead;
  $("sGrid").replaceChildren(...t.services.map(s => h("article", { class: "cat" }, h("h3", {}, s.t), h("p", {}, s.d), h("ul", {}, h("li", {}, s.tags)))));

  $("pT").textContent = t.portfolioTitle; $("pLead").textContent = t.portfolioLead;
  $("feat").replaceChildren(...C.featured.map((f, i) => {
    const e = t.events[i] || { t: "", m: "", d: "" };

    b.onclick = () => { $("lbImg").src = im.firstChild.src; $("lbImg").alt = e.t; $("lbCap").textContent = e.t + " | " + e.m; $("lb").showModal(); };
    return b;
  }));
  $("lbX").setAttribute("aria-label", t.close);

  $("cliT").textContent = t.clientsTitle; $("cliLead").textContent = t.clientsLead;
  $("logos").replaceChildren(...C.clients.map(n => h("div", {}, n)));

  $("gT").textContent = t.galleryTitle; $("gLead").textContent = t.galleryLead;

    const alt = t.galleryAlt + " " + (i + 1), im = pic(g.src, "Replace: photo " + (i + 1), 800, 600, alt);

    b.onclick = () => { $("lbImg").src = im.src; $("lbImg").alt = alt; $("lbCap").textContent = alt; $("lb").showModal(); };
    return b;
  }));
  $("prT").textContent = t.processTitle; $("prLead").textContent = t.processLead;
  $("steps").replaceChildren(...t.steps.map(x => h("li", {}, h("b", {}, x.t), h("p", {}, x.d))));
  $("inT").textContent = t.includedTitle; $("inList").replaceChildren(...t.included.map(x => h("li", {}, x)));
  $("fqT").textContent = t.faqTitle; $("fqLead").textContent = t.faqLead;
  $("fqList").replaceChildren(...t.faq.map(q => h("details", {}, h("summary", {}, q.q), h("p", {}, q.a))));

  $("rT").textContent = t.showreelTitle; $("rLead").textContent = t.showreelLead;
  $("rList").replaceChildren(...t.reelList.map(x => h("li", {}, x)));
  const v = $("video"); v.replaceChildren();
  if (/^[\w-]{11}$/.test(C.showreel.youtubeId)) {
    v.append(h("iframe", { src: "https://www.youtube-nocookie.com/embed/" + C.showreel.youtubeId, title: t.showreelTitle, loading: "lazy", allow: "accelerometer; encrypted-media; picture-in-picture", allowfullscreen: "" }));

  }

  $("aT").textContent = t.aboutTitle;
  $("aBody").replaceChildren(...t.bio.map(p => h("p", {}, p)));
  $("facts").replaceChildren(...t.facts.map(f => h("div", { class: "fact" }, h("b", {}, f.v), f.l)));
  $("xT").textContent = t.timelineTitle;
  $("tl").replaceChildren(...t.timeline.map(x => h("li", {}, h("b", {}, x.t), h("span", {}, x.y), h("p", {}, x.d))));

  $("tT").textContent = t.testimonialsTitle;
  $("tGrid").replaceChildren(...t.testimonials.map(q => h("blockquote", {}, h("p", {}, q.quote), h("footer", {}, [q.author, q.event].filter(Boolean).join(", ")))));

  const wa = waLink(C.whatsapp.message[lang] || C.whatsapp.message.en);
  $("hCta").href = wa; $("hCta").target = "_blank"; $("hCta").rel = "noopener";
  $("wa").href = wa; $("waLabel").textContent = "WhatsApp"; $("wa").setAttribute("aria-label", t.cta);
  $("cT").textContent = t.contactTitle; $("cBody").textContent = t.contactBody;
  const f = t.form;
  [["lN", "name"], ["lC", "company"], ["lT", "type"], ["lD", "date"], ["lM", "msg"], ["fBtn", "send"]].forEach(x => $(x[0]).textContent = f[x[1]]);
  $("fT").replaceChildren(...t.services.map(s => h("option", { value: s.t }, s.t)).concat(h("option", { value: f.other }, f.other)));
  const dl = t.info.map(x => h("div", {}, h("dt", {}, x.l), h("dd", {}, x.v)));
  if (/^\+?[\d\s-]{7,}$/.test(C.phone)) dl.push(h("div", {}, h("dt", {}, t.phoneLabel), h("dd", {}, h("a", { href: "tel:" + C.phone.replace(/[^\d+]/g, "") }, C.phone))));
  $("info").replaceChildren(...dl);

  const names = { linkedin: "LinkedIn", instagram: "Instagram", facebook: "Facebook", tiktok: "TikTok", youtube: "YouTube", xiaohongshu: lang === "zh" ? "小红书" : "Xiaohongshu" };
  const links = Object.keys(names).filter(k => safeUrl(C.social[k]).startsWith("https://")).map(k => h("li", {}, h("a", { href: C.social[k], target: "_blank", rel: "noopener" }, names[k])));
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(C.email)) links.push(h("li", {}, h("a", { href: "mailto:" + C.email }, C.email)));
  $("social").replaceChildren(...links);
  $("foot").replaceChildren("© " + new Date().getFullYear() + " " + t.name + ". " + t.footer, h("a", { href: "#top" }, t.top));
}

applyTheme(); render();
$("form").addEventListener("submit", e => {                // no backend: the enquiry is composed into a WhatsApp message
  e.preventDefault();
  const t = C.content[lang], f = t.form;
  if (!$("fN").value.trim()) { $("fN").setCustomValidity(f.errName); $("fN").reportValidity(); $("fN").setCustomValidity(""); return; }
  const v = id => $(id).value.trim();
  const lines = [f.name + ": " + v("fN"), v("fC") && f.company + ": " + v("fC"), f.type + ": " + v("fT"),
    v("fD") && f.date + ": " + v("fD"), v("fM") && f.msg + ": " + v("fM")].filter(Boolean);
  window.open(waLink((C.whatsapp.message[lang] || C.whatsapp.message.en) + "\n\n" + lines.join("\n")), "_blank", "noopener");
});
const nav = $("nav"), mb = $("menuBtn");
mb.onclick = () => { const o = nav.classList.toggle("open"); mb.setAttribute("aria-expanded", o); };
nav.addEventListener("click", e => { if (e.target.closest("a")) { nav.classList.remove("open"); mb.setAttribute("aria-expanded", "false"); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") { nav.classList.remove("open"); mb.setAttribute("aria-expanded", "false"); } });
$("lbX").onclick = () => $("lb").close();
$("lb").addEventListener("click", e => { if (e.target === $("lb")) $("lb").close(); });

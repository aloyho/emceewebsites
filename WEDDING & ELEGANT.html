      services: [

      ],

      venuesTitle: "曾主持的场地", venues: ["【场地名称】", "【场地名称】", "【场地名称】"],
      journeyTitle: "合作流程",
      journey: [ { t: "初次联系", d: "【新人如何与您取得联系。】" }, { t: "深入沟通", d: "【您的咨询电话或见面。】" },
                 { t: "规划流程", d: "【您如何与新人规划婚礼流程。】" }, { t: "享受婚礼", d: "【彩排与当天的支持。】" } ],

             { q: "可以用多种语言主持吗？", a: "【您的回答。】" }, { q: "婚礼在外地也可以吗？", a: "【您的回答。】" },

/* ============================ ENGINE (no edits needed) ============================ */
const $ = id => document.getElementById(id);
const safeUrl = u => /^(https:\/\/|\.{0,2}\/|[\w-]+\/|[\w-]+\.\w+$)/.test(u || "") ? u : "";
function h(tag, attrs, ...kids) {                          // text goes in as text nodes, never as HTML
  const e = document.createElement(tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  kids.forEach(c => e.append(c));
  return e;
}
const TONES = ["#D9C3AE", "#E3CFCB", "#CBBFA2", "#EAD9C0", "#C9A9A6", "#B8AD93"];
function placeholder(label, w, hgt, i) {
  const s = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}"><rect width="100%" height="100%" fill="${TONES[(i || 0) % TONES.length]}"/><text x="50%" y="50%" fill="#3A2E2B" fill-opacity=".7" font-family="Georgia,serif" font-style="italic" font-size="${Math.max(w / 22, 14)}" text-anchor="middle" dominant-baseline="middle">${label}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
}
const C = CONFIG;
let lang = C.languages.includes(localStorageGet("lang")) ? localStorageGet("lang") : C.languages[0];
function localStorageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function pic(id, src, label, w, hgt, alt, i) { const e = $(id); e.src = safeUrl(src) || placeholder(label, w, hgt, i); e.alt = alt || ""; }

function applyTheme() {
  document.documentElement.style.setProperty("--brand", C.brand.color);
  document.documentElement.style.setProperty("--ink", C.brand.ink);
  document.title = C.seo.title;
  if (/^https:\/\/fonts\.googleapis\.com\//.test(C.fontsUrl || "")) { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = C.fontsUrl; document.head.append(l); }
  const set = (sel, attr, val) => { const m = document.querySelector(sel); if (m && val) m.setAttribute(attr, val); };
  set('meta[name="description"]', "content", C.seo.description);
  set('link[rel="canonical"]', "href", C.seo.canonical);
  set('meta[property="og:title"]', "content", C.seo.title);
  set('meta[property="og:description"]', "content", C.seo.description);
  set('meta[property="og:url"]', "content", C.seo.canonical);
  set('meta[property="og:image"]', "content", C.seo.image);
}

const RATIOS = [[3, 4], [1, 1], [4, 5], [4, 3], [3, 4], [5, 4]];   // staggered gallery shapes
function render() {
  const t = C.content[lang];
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : "en";
  $("logo").textContent = t.logo;
  $("hName").textContent = t.name; $("hTitle").textContent = t.title; $("hTag").textContent = t.tagline;
  $("hCta").textContent = t.cta; $("hCta2").textContent = t.cta2;
  pic("hImg", C.heroImage, "Replace: wide hero photograph", 1600, 900, t.name, 0);
  pic("iImg", C.introImage, "Replace: host portrait", 800, 1000, t.name, 1);
  pic("sImg", C.storyImage, "Replace: cinematic wedding photograph", 1600, 686, "", 3);
  $("menuBtn").setAttribute("aria-label", t.menu);

  const showT = t.testimonials.length > 0;
  const items = ["intro", "story", "portfolio", "services", "showreel"].concat(showT ? ["testimonials"] : [], t.faq.length ? ["faq"] : [], ["contact"]);
  const ul = $("navList"); ul.replaceChildren();
  items.forEach(k => ul.append(h("li", {}, h("a", { href: "#" + k }, t.nav[k]))));
  if (C.languages.length > 1) {
    const other = C.languages.find(l => l !== lang);
    const b = h("button", { class: "lang", type: "button", "aria-label": "Switch language" }, other === "zh" ? "中文" : "EN");
    b.onclick = () => { lang = other; localStorageSet("lang", lang); render(); };
    ul.append(h("li", {}, b));
  }

  $("iT").textContent = t.introTitle;
  $("iBody").replaceChildren(...t.intro.map(p => h("p", {}, p)));
  $("iSign").textContent = t.sign;
  $("aT").textContent = t.aboutTitle;
  $("chapters").replaceChildren(...t.chapters.map(c => h("div", { class: "chap rv" }, h("h3", {}, c.h), h("p", {}, c.p))));
  $("facts").replaceChildren(...t.facts.map(f => h("div", { class: "fact" }, h("b", {}, f.v), f.l)));
  $("vT").textContent = t.venuesTitle; $("vT").hidden = !t.venues.length;
  $("venues").replaceChildren(...t.venues.map(v => h("li", {}, v)));

  $("pT").textContent = t.portfolioTitle; $("pSub").textContent = t.portfolioSub;
  $("gallery").replaceChildren(...C.gallery.map((g, i) => {
    const [rw, rh] = RATIOS[i % RATIOS.length];
    const src = safeUrl(g.src) || placeholder("Replace: photo " + (i + 1), rw * 200, rh * 200, i);
    const img = h("img", { src, alt: g.alt || "", loading: "lazy", width: rw * 200, height: rh * 200 });
    const b = h("button", { type: "button", class: "rv", style: `aspect-ratio:${rw}/${rh}`, "aria-label": (g.alt || "Photo") + " (enlarge)" }, img);
    b.onclick = () => { $("lbImg").src = src; $("lbImg").alt = g.alt || ""; $("lbCap").textContent = g.alt || ""; $("lb").showModal(); };
    return b;
  }));
  $("lbX").setAttribute("aria-label", t.close);

  $("sT").textContent = t.servicesTitle;
  $("sGrid").replaceChildren(...t.services.map(s => h("article", { class: "svc" }, h("h3", {}, s.t), h("p", {}, s.d))));
  $("stT").textContent = t.stylesTitle; $("stT").hidden = !t.styles.length;
  $("styles").replaceChildren(...t.styles.map(s => h("li", {}, s)));
  $("jT").textContent = t.journeyTitle; $("jT").hidden = !t.journey.length;
  $("steps").replaceChildren(...t.journey.map(s => h("li", {}, h("h4", {}, s.t), h("p", {}, s.d))));

  $("rT").textContent = t.showreelTitle;
  const v = $("video"); v.replaceChildren();
  if (/^[\w-]{11}$/.test(C.showreel.youtubeId)) {
    v.style.padding = "0";
    v.append(h("iframe", { src: "https://www.youtube-nocookie.com/embed/" + C.showreel.youtubeId, title: t.showreelTitle, loading: "lazy", allow: "accelerometer; encrypted-media; picture-in-picture", allowfullscreen: "" }));
  } else v.append(h("p", {}, t.showreelEmpty));

  $("testimonials").hidden = !showT;
  $("tT").textContent = t.testimonialsTitle;
  $("tGrid").replaceChildren(...t.testimonials.map(q => h("blockquote", { class: "rv" }, h("p", {}, q.quote), h("footer", {}, [q.author, q.event].filter(Boolean).join(", ")))));

  $("faq").hidden = !t.faq.length; $("fT").textContent = t.faqTitle;
  $("fGrid").replaceChildren(...t.faq.map(f => h("details", {}, h("summary", {}, f.q), h("p", {}, f.a))));
  $("cNote").textContent = t.contactNote || ""; $("cNote").hidden = !t.contactNote;
  const num = String(C.whatsapp.number).replace(/\D/g, "");
  const wa = "https://wa.me/" + num + "?text=" + encodeURIComponent(C.whatsapp.message[lang] || C.whatsapp.message.en);
  $("wa").href = wa; $("waLabel").textContent = "WhatsApp";
  $("wa").setAttribute("aria-label", t.cta);
  $("hCta").href = wa; $("hCta").target = "_blank"; $("hCta").rel = "noopener";
  $("cT").textContent = t.contactTitle; $("cBody").textContent = t.contactBody;
  $("cBtn").className = "btn"; $("cBtn").href = wa; $("cBtn").target = "_blank"; $("cBtn").textContent = t.cta;

  const names = { instagram: "Instagram", facebook: "Facebook", tiktok: "TikTok", youtube: "YouTube", xiaohongshu: lang === "zh" ? "小红书" : "Xiaohongshu" };
  const links = Object.keys(names).filter(k => safeUrl(C.social[k]).startsWith("https://")).map(k => h("li", {}, h("a", { href: C.social[k], target: "_blank", rel: "noopener" }, names[k])));
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(C.email)) links.push(h("li", {}, h("a", { href: "mailto:" + C.email }, C.email)));
  $("social").replaceChildren(...links);
  $("foot").textContent = "© " + new Date().getFullYear() + " " + t.name + ". " + t.footer;
  reveal();
}

/* Gentle reveal on scroll (soft fade) */
function reveal() {
  const els = document.querySelectorAll(".rv:not(.in)");
  if (!("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: .12 });
  els.forEach(e => io.observe(e));
}
/* Slow hero parallax (skipped when reduced motion is requested) */
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  let tick = false;
  addEventListener("scroll", () => { if (tick) return; tick = true; requestAnimationFrame(() => { const y = Math.min(scrollY, 900); $("hImg").style.transform = "translateY(" + (y * .12) + "px)"; tick = false; }); }, { passive: true });
}

applyTheme(); render();
const nav = $("nav"), mb = $("menuBtn");
mb.onclick = () => { const o = nav.classList.toggle("open"); mb.setAttribute("aria-expanded", o); };
nav.addEventListener("click", e => { if (e.target.closest("a")) { nav.classList.remove("open"); mb.setAttribute("aria-expanded", "false"); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") { nav.classList.remove("open"); mb.setAttribute("aria-expanded", "false"); } });
$("lbX").onclick = () => $("lb").close();
$("lb").addEventListener("click", e => { if (e.target === $("lb")) $("lb").close(); });
</script>
